[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdrnema"
version = "0.1.0"
description = "asciinema for agent fleets — record and replay herdr sessions with an agent lifecycle timeline"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
herdrnema = "herdrnema.__main__:main"

[tool.setuptools.packages.find]
include = ["herdrnema*"]
